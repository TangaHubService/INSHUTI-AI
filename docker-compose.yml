services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inshuti
      POSTGRES_USER: inshuti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inshuti"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://inshuti:${POSTGRES_PASSWORD}@postgres:5432/inshuti?schema=public
      JWT_SECRET: ${JWT_SECRET}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:-http://localhost:3000}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["4000:4000"]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  postgres_data:
  uploads:
